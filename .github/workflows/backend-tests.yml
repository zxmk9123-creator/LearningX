name: LearningX Backend Tests
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
  postgres:
    # The live publish path (_publish_pipelined) runs only on PostgreSQL;
    # SQLite runs above cannot exercise it. Modules are named explicitly:
    # tests/test_api.py pins SQLite on import, so discover would bind SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learningx
          POSTGRES_PASSWORD: learningx
          POSTGRES_DB: learningx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learningx -d learningx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://learningx:learningx@localhost:5432/learningx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: PostgreSQL publish, classroom and question-list tests
        run: python -m unittest tests.test_publish_postgres tests.test_classroom tests.test_question_queries -v
        working-directory: backend
      - name: Fail if the PostgreSQL tests were skipped
        working-directory: backend
        run: |
          python - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromName("tests.test_publish_postgres")
          result = unittest.TextTestRunner(verbosity=0).run(suite)
          assert result.wasSuccessful() and not result.skipped and result.testsRun >= 5, result.skipped
          PY
