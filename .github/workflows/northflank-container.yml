name: LearningX Northflank Container Build

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/northflank-container.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect Python container (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: learningx-northflank:test
      - name: Validate non-root runtime and bundled NIT engine
        run: |
          docker run --rm --entrypoint python learningx-northflank:test -c '
          import os
          from pathlib import Path
          assert os.getuid() != 0
          assert os.getenv("NIT_HOSTED_RUNTIME") == "1"
          assert Path("/app/nit_engine/scripts/ingest.py").is_file()
          assert Path("/app/nit_engine/scripts/verified_coaching.py").is_file()
          assert Path("/app/learningx/northflank_worker.py").is_file()
          print("Northflank image structural check passed")
          '
      - name: Verify missing production secrets fail closed
        run: |
          set +e
          docker run --rm --entrypoint python learningx-northflank:test -m learningx.northflank_worker
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
